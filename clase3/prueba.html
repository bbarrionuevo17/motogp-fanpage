<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo HTML Básico</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>¡Hola, mundo!</h1>
  <p>Este es un ejemplo de una página HTML básica.</p>
  <h2> Tabla </h2>
  <table style="width:50%">
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>Ciudad</th>
    </tr>
    <tr>
      <td>Juan</td>
      <td>25</td>
      <td>Madrid</td>
    </tr>
    <tr>
      <td>María</td>
      <td>30</td>
      <td>Barcelona</td>
    </tr>
  </table>
</body>
</html>
