    <main>
        <section id="galeria">
            <h2>Galería Multimedia</h2>
            <div class="galeria-grid">
                <div id="carrusel" style="max-width:400px; margin:auto; position:relative;">
                    <img id="carrusel-img" src="accion-carrera.jpg" alt="Carrusel MotoGP" style="width:100%;height:auto;display:block;">
                    <button id="prev" style="position:absolute;left:0;top:50%;transform:translateY(-50%);">&#8592;</button>
                    <button id="next" style="position:absolute;right:0;top:50%;transform:translateY(-50%);">&#8594;</button>
                </div>
            
                <figure>
                    <iframe 
                        src="https://www.youtube.com/embed/-2bV-lvL2dE"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                    <figcaption>
                        MARC MÁRQUEZ ARRASÓ EN HUNGRÍA Y LLEVA SIETE TRIUNFOS AL HILO EN MOTO GP | RESUMEN
                    </figcaption>
                </figure>
            </div>
            <h3>Web oficial MotoGP</h3>
            <iframe src="https://www.motogp.com/es" width="100%" height="400" title="MotoGP.com"></iframe>
            <h3>Arrastra una imagen aquí</h3>
            
        </section>
        <script>
        // Carrusel de imágenes
        const imagenes = [
            'img/WhatsApp Image 2025-09-27 at 12.53.32.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.53.40.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.53.48.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.53.57.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.54.06.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.54.17.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.54.26.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.54.36.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.54.53.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.01.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.13.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.26.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.34.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.44.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.55.52.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.04.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.15.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.23.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.32.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.41.jpeg',
            'img/WhatsApp Image 2025-09-27 at 12.56.51.jpeg'
        ];
        let idx = 0;
        const img = document.getElementById('carrusel-img');
        img.src = imagenes[0];
        document.getElementById('prev').onclick = ()=>{
            idx = (idx-1+imagenes.length)%imagenes.length;
            img.src = imagenes[idx];
        };
        document.getElementById('next').onclick = ()=>{
            idx = (idx+1)%imagenes.length;
            img.src = imagenes[idx];
        };
        </script>
        
    </main>
